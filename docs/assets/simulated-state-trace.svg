<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Alarm controller: recorded simulation trace</title>
  <desc id="desc">Seven recorded state entries from the real controller running with GPIO doubles and a manually advanced clock. Telegram is disabled. No physical hardware test.</desc>
  <rect width="100%" height="100%" fill="#f5f7fb" />
  <text x="42" y="54" font-family="system-ui, sans-serif" font-size="30" fill="#17243d" font-weight="650">Alarm controller</text>
  <text x="42" y="87" font-family="system-ui, sans-serif" font-size="17" fill="#17243d" font-weight="400">Recorded local simulation · actual controller, GPIO doubles, manual clock</text>
  <text x="42" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#53647a" font-weight="650">EVENT</text>
  <text x="130" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#53647a" font-weight="650">SIMULATED TIME</text>
  <text x="345" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#53647a" font-weight="650">STATE</text>
  <text x="720" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#53647a" font-weight="650">DISPLAY CALL</text>
  <rect x="30" y="150" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="182" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">01</text>
  <text x="130" y="182" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">0 s</text>
  <circle cx="321" cy="175" r="6" fill="#16856c" />
  <text x="345" y="182" font-family="system-ui, sans-serif" font-size="20" fill="#16856c" font-weight="650">DISARMED</text>
  <text x="720" y="182" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">blank</text>
  <rect x="30" y="210" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">02</text>
  <text x="130" y="242" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">0 s</text>
  <circle cx="321" cy="235" r="6" fill="#3e62bf" />
  <text x="345" y="242" font-family="system-ui, sans-serif" font-size="20" fill="#3e62bf" font-weight="650">EXIT_DELAY</text>
  <text x="720" y="242" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">15</text>
  <rect x="30" y="270" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="302" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">03</text>
  <text x="130" y="302" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">15 s</text>
  <circle cx="321" cy="295" r="6" fill="#53647a" />
  <text x="345" y="302" font-family="system-ui, sans-serif" font-size="20" fill="#53647a" font-weight="650">ARMED</text>
  <text x="720" y="302" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">----</text>
  <rect x="30" y="330" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="362" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">04</text>
  <text x="130" y="362" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">15 s</text>
  <circle cx="321" cy="355" r="6" fill="#bb780b" />
  <text x="345" y="362" font-family="system-ui, sans-serif" font-size="20" fill="#bb780b" font-weight="650">PREALARM</text>
  <text x="720" y="362" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">10</text>
  <rect x="30" y="390" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="422" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">05</text>
  <text x="130" y="422" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">25 s</text>
  <circle cx="321" cy="415" r="6" fill="#c74754" />
  <text x="345" y="422" font-family="system-ui, sans-serif" font-size="20" fill="#c74754" font-weight="650">ALARM</text>
  <text x="720" y="422" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">blank</text>
  <rect x="30" y="450" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="482" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">06</text>
  <text x="130" y="482" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">85 s</text>
  <circle cx="321" cy="475" r="6" fill="#53647a" />
  <text x="345" y="482" font-family="system-ui, sans-serif" font-size="20" fill="#53647a" font-weight="650">ARMED</text>
  <text x="720" y="482" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">----</text>
  <rect x="30" y="510" width="940" height="50" rx="9" fill="#ffffff" />
  <text x="53" y="542" font-family="system-ui, sans-serif" font-size="17" fill="#53647a" font-weight="400">07</text>
  <text x="130" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">85 s</text>
  <circle cx="321" cy="535" r="6" fill="#16856c" />
  <text x="345" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#16856c" font-weight="650">DISARMED</text>
  <text x="720" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#17243d" font-weight="400">blank</text>
  <text x="42" y="608" font-family="system-ui, sans-serif" font-size="16" fill="#53647a" font-weight="400">85 seconds are simulated time. No physical or network validation.</text>
</svg>